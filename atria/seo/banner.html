<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Atria Dawn Preview</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #08090d; color: #f8f5ef; font-family: Arial, Helvetica, sans-serif; }
    .canvas { position: relative; width: 1200px; height: 630px; overflow: hidden; background: linear-gradient(118deg, #0b0b10 0%, #17121a 54%, #2b1822 100%); }
    .canvas::before { content: ''; position: absolute; inset: -180px -100px auto auto; width: 700px; height: 700px; border-radius: 50%; background: radial-gradient(circle, rgba(244, 171, 113, .34) 0%, rgba(204, 91, 99, .16) 35%, transparent 70%); filter: blur(12px); }
    .canvas::after { content: ''; position: absolute; inset: 0; opacity: .12; background-image: linear-gradient(rgba(255,255,255,.13) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.13) 1px, transparent 1px); background-size: 56px 56px; mask-image: linear-gradient(90deg, black, transparent 78%); }
    .orb { position: absolute; right: 92px; top: 90px; width: 360px; height: 360px; border: 1px solid rgba(255, 220, 186, .28); border-radius: 50%; box-shadow: 0 0 80px rgba(240, 127, 105, .18), inset 0 0 70px rgba(255, 202, 160, .08); }
    .orb::before, .orb::after { content: ''; position: absolute; border-radius: 50%; border: 1px solid rgba(255, 205, 169, .16); }
    .orb::before { inset: 36px; }
    .orb::after { inset: 82px; border-color: rgba(255, 205, 169, .22); }
    .content { position: relative; z-index: 2; height: 100%; padding: 64px 78px; display: flex; flex-direction: column; justify-content: space-between; }
    .brand { display: flex; align-items: center; gap: 18px; }
    .mark { width: 52px; height: 45px; object-fit: contain; }
    .wordmark { width: 170px; height: auto; display: block; filter: brightness(0) invert(1); opacity: .96; }
    .eyebrow { color: #f1a87d; font-size: 16px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; }
    h1 { margin-top: 18px; max-width: 640px; font-size: 66px; line-height: .98; letter-spacing: -.055em; font-weight: 700; }
    h1 span { color: #f2b185; }
    .description { margin-top: 26px; max-width: 505px; color: #c8b8b7; font-size: 22px; line-height: 1.42; }
    .footer { display: flex; align-items: center; gap: 18px; color: #a99495; font-size: 17px; letter-spacing: .04em; }
    .line { width: 54px; height: 1px; background: #e49a7a; }
  </style>
</head>
<body>
  <main class="canvas">
    <div class="orb"></div>
    <div class="content">
      <div class="brand">
        <img class="mark" src="../../../../Downloads/atria-logo-final.png" alt="Atria mark">
        <img class="wordmark" src="../../../../Downloads/atria.png" alt="Atria">
      </div>
      <div>
        <div class="eyebrow">Orvix model preview</div>
        <h1>Meet <span>Atria</span><br>Dawn Preview</h1>
        <p class="description">A new multimodal intelligence experience, now available to explore on Orvix.</p>
      </div>
      <div class="footer"><span class="line"></span><span>atria-dawn-preview &nbsp;·&nbsp; orvix.id</span></div>
    </div>
  </main>
</body>
</html>
