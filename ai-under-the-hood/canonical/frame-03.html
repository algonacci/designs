<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, initial-scale=1" />
<title>AUTH — 03 Attention</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="system.css">
<style>
  .head-line { font-size: var(--t-head); font-weight: 700; letter-spacing: -.03em; line-height: 1.06; }
  .colhead {
    display: flex;
    font-family: var(--mono);
    font-size: var(--t-micro);
    letter-spacing: .04em;
    color: var(--ink-4);
    margin-bottom: 10px;
  }
  .colhead span { width: 45px; text-align: center; flex: none; }
  .colhead span.q { color: var(--selected); }
  .mx.field { grid-template-columns: repeat(12, 42px); grid-auto-rows: 42px; }
  .rowsum i { width: 0; height: 42px; }
  .rowlab {
    font-family: var(--mono);
    font-size: var(--t-micro);
    color: var(--ink-4);
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    width: 96px;
  }
  .rowlab.q { color: var(--selected); }
</style>
</head>
<body>
<div class="frame">

  <header class="f-head">
    <span>AI UNDER THE HOOD<b> · 004</b></span>
    <span class="mark" style="--mk-w:52px;--mk-h:30px;--mk-tick:3px;--mk-gap:3px;--mk-out:9px;--mk-in:24px;--mk-edge:3px">
      <i></i><i></i><i class="in"></i><i class="in"></i><i class="in"></i><i></i><i></i>
      <span class="edge" style="left:15px"></span><span class="edge" style="left:34px"></span>
    </span>
  </header>

  <main class="f-body">

    <div class="section-mark">02 · WEIGHT FIELD</div>

    <div class="head-line" style="margin-top:var(--u3)">IT DOES NOT READ<br>LEFT TO RIGHT. IT WEIGHS.</div>

    <div style="height:var(--u4)"></div>

    <!-- LAYER 1 sits at the edge: the aperture brackets the columns this query
         is allowed to see. LAYER 2 sits inside: the matrix is ink and magenta,
         never sodium. Neither device is ever in the other's territory. -->
    <div style="display:flex;align-items:flex-start;gap:var(--u2)">
      <div id="rowlabs"></div>
      <div style="position:relative">
        <div class="colhead" id="colhead"></div>
        <div style="position:relative;display:inline-block">
          <div class="mx field" id="mx"></div>
          <div class="aperture" id="ap" style="position:absolute;top:-16px;bottom:-16px;padding:0"></div>
        </div>
      </div>
      <div style="padding-top:34px"><div class="rowsum" id="rowsum"></div></div>
    </div>

    <div style="position:relative;height:180px;margin-top:var(--u2)">
      <div class="note up" id="nAp" style="top:34px;--len:26px"><em>THE QUERY'S HORIZON</em> — EVERYTHING<br>TOKEN 08 IS PERMITTED TO SEE</div>
      <div class="note up" style="left:0;top:130px;--len:22px">EMPTY IS <b>NOT ZERO</b>. IT IS THE FUTURE, MASKED OUT.</div>
    </div>

    <div class="readout" style="margin-top:var(--u2)">
      <span class="k">QUERY</span> <span class="v">08 · "·ov"</span>
      &nbsp;&nbsp;<span class="k">Σ</span> <span class="v">1.000</span>
      &nbsp;&nbsp;<span class="k">HEAD</span> <span class="v">7 / 12</span>
    </div>

  </main>

  <footer class="f-foot">
    <span class="pubid">ALG / UNDER·HOOD / <b>004</b></span>
    <span>ATTENTION</span>
  </footer>

</div>
<script>
const rnd = (function (a) { return function () {
  a |= 0; a = (a + 0x6D2B79F5) | 0;
  let t = Math.imul(a ^ (a >>> 15), 1 | a);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}; })(20260901);

const N = 12, Q = 8;
const TOKENS = ["The","·qu","ick","·bro","wn","·fox","·ju","mps","·ov","er","·it","·all"];

const colhead = document.getElementById("colhead");
for (let i = 0; i < N; i++) {
  const s = document.createElement("span");
  if (i === Q) s.className = "q";
  s.textContent = String(i).padStart(2, "0");
  colhead.appendChild(s);
}

const rowlabs = document.getElementById("rowlabs");
const spacer = document.createElement("div");
spacer.style.height = "34px";
rowlabs.appendChild(spacer);
for (let y = 0; y < N; y++) {
  const d = document.createElement("div");
  d.className = "rowlab" + (y === Q ? " q" : "");
  d.textContent = TOKENS[y];
  rowlabs.appendChild(d);
}

/* Real attention is heavy on the diagonal and heavy on token 0 — the
   documented attention sink. A flat random field would look tidier and would
   be a picture of something that does not happen. */
const mx = document.getElementById("mx");
const sums = [];
for (let y = 0; y < N; y++) {
  let rowMax = 0;
  for (let x = 0; x < N; x++) {
    const cell = document.createElement("i");
    if (x > y) { cell.className = "masked"; mx.appendChild(cell); continue; }
    let w = Math.exp(-(y - x) / 2.2) + (x === 0 ? 0.6 : 0) + rnd() * 0.14;
    w = Math.min(1, w / 1.8);
    rowMax = Math.max(rowMax, w);
    if (y === Q) cell.className = "q";
    cell.style.opacity = (0.12 + w * 0.88).toFixed(2);
    mx.appendChild(cell);
  }
  sums.push(rowMax);
}

const rowsum = document.getElementById("rowsum");
sums.forEach((v, y) => {
  const i = document.createElement("i");
  if (y === Q) i.className = "q";
  i.style.width = (16 + v * 104).toFixed(0) + "px";
  rowsum.appendChild(i);
});

/* Aperture spans columns 0..Q — measured from the grid, not typed in. */
const CELL = 42, GAP = 3, STEP = CELL + GAP;
const ap = document.getElementById("ap");
const x1 = Q * STEP + CELL, W = (N - 1) * STEP + CELL;
ap.style.left = "-14px";
ap.style.right = (W - x1 + 14) + "px";
document.getElementById("nAp").style.left = (x1 - 300) + "px";
</script>
</body>
</html>
