    <text x="540" y="590" fill="#53d7f4" font-size="106">JADI JSON.</text>
  </g>
  <text x="540" y="659" fill="#aab0bb" font-family="Inter, Arial, sans-serif" font-size="30" text-anchor="middle">Tiga API dokumen, dibangun Orvix.</text>

