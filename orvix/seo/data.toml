# Orvix.id OG banner data — single source of truth.
# One [banners.KEY] section per route. Regenerate after editing:
#   cd designs
#   bun run orvix/seo/generate.ts && bun run orvix/seo/render.ts --force && bun run orvix/seo/convert.ts --force
#
# Fields:
#   key       unique id, also the filename: banner_{key}.html / .png / .webp
#   page      <title> of the generated HTML (debug only, never rendered)
#   tag       small uppercase pill above the headline
#   headline  main line. <grad>...</grad> marks the gradient span, <br> forces a
#             line break. Set both by hand — auto-wrapping strands single words.
#   subtitle  grey supporting line, keep to two rendered lines
#   accent    hex — drives the glow, badge, headline gradient, accent line.
#             KEEP INSIDE THE ORVIX RAMP (cyan #4de4ff -> blue #5b8cff ->
#             purple #9b72ff). Warm hues like amber tint the whole canvas brown
#             and the banner stops looking like Orvix.
#   url_path  appended to "orvix.id/" at the bottom. Empty for the home page.

