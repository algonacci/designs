<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orvix — AI Router (Story)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="styles_story.css" />
</head>

<body>
  <div class="canvas">

    <div class="bg">
      <div class="blob blob--a"></div>
      <div class="blob blob--b"></div>
      <div class="blob blob--c"></div>
      <div class="grid"></div>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
      <span class="particle"></span>
    </div>

    <div class="frame">

      <header class="nav">
        <div class="brand">
          <img class="brand__logo" src="../img/logo/orvix-logo.png" alt="Orvix" />
          <span class="brand__name">Orvix</span>
        </div>
        <div class="label"><span class="ping"></span>CLOSED BETA</div>
      </header>

      <main class="s-main">
        <section class="s-hero">
          <p class="eyebrow">EARLY ACCESS</p>
          <h1 class="headline">Model baru.<br /><span class="grad">Token gratis.</span></h1>
          <p class="subhead">
            DeepSeek V4 Flash + Kimi K3
          </p>

          <div class="promo"><strong>FREE TOKENS</strong><span>buat beta tester</span></div>

          <div class="features">
            <div class="model-card model-card--blue">
              <img class="model-card__logo" src="../img/logo/deepseek-v4-flash.webp" alt="DeepSeek" />
              <div class="model-card__name">DeepSeek<br />V4 Flash</div>
              <span class="model-card__tag">FAST / NEW</span>
            </div>
            <div class="model-card model-card--violet">
              <img class="model-card__logo" src="../img/logo/kimi-k3.png" alt="Kimi" />
              <div class="model-card__name">Kimi<br />K3</div>
              <span class="model-card__tag">SMART / NEW</span>
            </div>
          </div>

        </section>
      </main>

      <footer class="foot">
        <a class="cta" href="https://platform.orvix.id">
          platform.orvix.id
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </a>
        <div class="foot__url"></div>
      </footer>

    </div>
  </div>
</body>

</html>
