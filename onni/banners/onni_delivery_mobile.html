<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>ONNI banner: Jadwal Kirim (mobile 1080x1080)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="banner mobile">
    <div class="blob" style="width: 860px; height: 860px; left: 360px; top: 460px;"></div>

    <div class="copy">
      <div class="head">
        <span class="wordmark">ONNI</span>
        <span class="kicker">Pengiriman</span>
      </div>
      <h1>Diantar sesuai<br /><em>jadwalmu</em></h1>
      <div class="chips">
        <span class="chip"><b>Pagi</b>09–12</span>
        <span class="chip"><b>Siang</b>13–17</span>
        <span class="chip"><b>Sore</b>18–21</span>
      </div>
      <span class="note">Jabodetabek &amp; Jawa Timur</span>
    </div>

    <div class="photo" style="left: 84px; top: 530px; width: 290px; height: 340px;">
      <img src="../img/akisai.jpg" alt="" />
    </div>
    <div class="photo" style="left: 395px; top: 490px; width: 290px; height: 380px;">
      <img src="../img/hinata.jpg" alt="" />
    </div>
    <div class="photo" style="left: 706px; top: 530px; width: 290px; height: 340px;">
      <img src="../img/kazuya.jpg" alt="" />
    </div>
  </div>
</body>
</html>
