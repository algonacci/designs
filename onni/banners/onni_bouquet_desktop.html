<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>ONNI banner: Hand Bouquet (desktop 1920x517)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="banner desktop">
    <div class="blob" style="width: 640px; height: 640px; left: 1110px; top: -170px;"></div>
    <div class="blob" style="width: 180px; height: 180px; left: 1720px; top: 300px; background: var(--warm-light);"></div>

    <div class="copy">
      <div class="head">
        <span class="wordmark">ONNI</span>
        <span class="kicker">Hand Bouquet</span>
      </div>
      <h1>Rangkai momen spesial<br />dengan <em>bunga segar</em></h1>
      <p class="sub">Buket rangkaian florist ONNI untuk ulang tahun, anniversary, dan ucapan terima kasih, lengkap dengan kartu ucapan.</p>
      <span class="cta">Lihat Hand Bouquet <span class="arrow">→</span></span>
    </div>

    <div class="photo" style="left: 1170px; top: 30px; width: 300px; height: 345px;">
      <img src="../img/momiji.jpg" alt="" />
      <span class="tag">Momiji</span>
    </div>
    <div class="photo" style="left: 1500px; top: 70px; width: 270px; height: 300px;">
      <img src="../img/kaori.jpg" alt="" />
      <span class="tag">Kaori</span>
    </div>
  </div>
</body>
</html>
