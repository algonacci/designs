<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>ONNI banner: Bunga &amp; Kue (desktop 1920x517)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="banner desktop dark">
    <div class="blob" style="width: 720px; height: 720px; left: 1080px; top: -230px;"></div>

    <div class="copy">
      <div class="head">
        <span class="wordmark">ONNI</span>
        <span class="kicker">Bunga &amp; Kue</span>
      </div>
      <h1>Hadiah lebih lengkap<br />dengan <em>kue pilihan</em></h1>
      <p class="sub">Pasangkan buket favorit dengan red velvet, tiramisu, atau earl grey cake dari koleksi Cake &amp; Card.</p>
      <span class="cta">Lihat Cake &amp; Card <span class="arrow">→</span></span>
    </div>

    <div class="photo" style="left: 1150px; top: 30px; width: 360px; height: 345px;">
      <img src="../img/kyoko-cake.jpg" alt="" />
      <span class="tag">Kyoko &amp; Cake</span>
    </div>
    <div class="photo" style="left: 1540px; top: 80px; width: 260px; height: 290px;">
      <img src="../img/red-velvet.jpg" alt="" />
      <span class="tag">Red Velvet Cake</span>
    </div>
  </div>
</body>
</html>
