<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <title>ONNI banner: Jadwal Kirim (desktop 1920x517)</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="banner desktop">
    <div class="blob" style="width: 560px; height: 560px; left: 1140px; top: -120px;"></div>

    <div class="copy">
      <div class="head">
        <span class="wordmark">ONNI</span>
        <span class="kicker">Pengiriman</span>
      </div>
      <h1>Diantar sesuai <em>jadwalmu</em></h1>
      <p class="sub">Pilih tanggal dan slot pengiriman saat checkout.</p>
      <div class="chips">
        <span class="chip"><b>Pagi</b>09.00–12.00</span>
        <span class="chip"><b>Siang</b>13.00–17.00</span>
        <span class="chip"><b>Sore</b>18.00–21.00</span>
      </div>
      <span class="note">Jabodetabek &amp; Jawa Timur</span>
    </div>

    <div class="photo" style="left: 1000px; top: 70px; width: 240px; height: 290px;">
      <img src="../img/akisai.jpg" alt="" />
      <span class="tag">Akisai</span>
    </div>
    <div class="photo" style="left: 1270px; top: 30px; width: 280px; height: 345px;">
      <img src="../img/hinata.jpg" alt="" />
      <span class="tag">Hinata</span>
    </div>
    <div class="photo" style="left: 1580px; top: 70px; width: 220px; height: 290px;">
      <img src="../img/kazuya.jpg" alt="" />
    </div>
  </div>
</body>
</html>
